<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Screen Recorder</h1>
        <div class="controls">
            <button id="startBtn" class="btn">Start Recording</button>
            <button id="stopBtn" class="btn" disabled>Stop Recording</button>
            <button id="downloadBtn" class="btn" disabled>Download</button>
        </div>
        <div class="video-container">
            <video id="preview" autoplay playsinline muted></video>
        </div>
        <div class="instructions">
            <h2>Instructions:</h2>
            <ol>
                <li>Click "Start Recording" and select a screen or window to capture</li>
                <li>Click "Stop Recording" when you're done</li>
                <li>Click "Download" to save your recording</li>
            </ol>
        </div>
    </div>
    <script src="script.js"></script>
